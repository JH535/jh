name: Daily AI Trend Magazine

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *" # 08:00 Asia/Seoul

permissions:
  contents: read
  copilot-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out magazine workflow
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Collect public news and community signals
        run: python scripts/collect_sources.py > candidates.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install GitHub Copilot CLI
        run: npm install --global @github/copilot

      - name: Write Korean magazine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            cat .github/AI_MAGAZINE_PROMPT.md
            printf '\n\nSOURCE CANDIDATES (JSON):\n'
            cat candidates.json
          } > prompt.txt
          copilot -p "$(cat prompt.txt)" -s > daily_issue.txt
          python - <<'PY'
          from pathlib import Path
          issue = Path("daily_issue.txt").read_text(encoding="utf-8").strip()
          if not issue or len(issue) > 3800:
              raise SystemExit(f"Magazine length invalid: {len(issue)} characters")
          if "PSPath" in issue or "PSParentPath" in issue:
              raise SystemExit("Unexpected PowerShell metadata in magazine")
          PY

      - name: Send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          message = Path("daily_issue.txt").read_text(encoding="utf-8").strip()
          if not token or not chat_id or not message:
              raise SystemExit("Telegram secrets or message are missing")
          payload = json.dumps({
              "chat_id": chat_id,
              "text": message,
              "disable_web_page_preview": True,
          }).encode("utf-8")
          req = Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          with urlopen(req, timeout=30) as response:
              result = json.loads(response.read())
          if not result.get("ok"):
              raise SystemExit("Telegram rejected the message")
          print("Telegram delivery succeeded")
          PY
